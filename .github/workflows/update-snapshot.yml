name: Update Fractured snapshot

# Refreshes snapshot.json from FRED + GDELT + curated.json and commits it back.
# GitHub Pages then serves the committed file to the app.

on:
  schedule:
    - cron: "0 13 * * 1"   # every Monday 13:00 UTC
  workflow_dispatch:
    inputs:
      backfill:
        description: "Rebuild full history from scratch (first run / reseed)"
        type: boolean
        default: false

permissions:
  contents: write           # allow the job to push the regenerated snapshot

concurrency:
  group: update-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate snapshot
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # the only secret needed; GDELT is keyless
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python3 generate_snapshot.py --backfill --out snapshot.json
          else
            python3 generate_snapshot.py --out snapshot.json
          fi

      - name: Commit if changed
        run: |
          git config user.name  "fractured-bot"
          git config user.email "noreply@github.com"
          if git diff --quiet -- snapshot.json; then
            echo "No change in snapshot.json"
          else
            git add snapshot.json
            git commit -m "data: refresh snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

      # The generator's output has to reach the endpoint the CURRENT app reads.
      # Nothing did that: R2 was never written to by this job, the Function fell
      # through to a static copy that was hand-placed once, and when that aged
      # past the 21-day rule the endpoint served 503 for a week with no signal.
      # Uses the S3 endpoint, not `wrangler r2 object put --remote`. Wrangler's
      # remote path calls /accounts/*/r2/buckets/*/objects/*, which needs the
      # account-wide "Workers R2 Storage: Edit" permission — a bucket-scoped R2
      # token 403s there. The bucket-scoped token IS valid for S3, which keeps
      # this job's credentials confined to the one bucket it writes.
      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ASOF=$(python3 -c "import json;print(json.load(open('snapshot.json'))['asOf'])")
          SHA=$(shasum -a 256 snapshot.json | cut -d' ' -f1)
          ENDPOINT="https://${ACCOUNT_ID}.r2.cloudflarestorage.com"
          put() {
            aws s3api put-object \
              --endpoint-url "$ENDPOINT" \
              --bucket stacktrace-public-data \
              --key "$1" \
              --body snapshot.json \
              --content-type 'application/json; charset=utf-8' \
              --cache-control 'public, max-age=600, must-revalidate' >/dev/null
          }
          # Immutable archive first, so the served object is never the only copy.
          put "fracturedus/archive/${ASOF}-${SHA:0:16}.json"
          put "fracturedus/snapshot.json"
          echo "uploaded $ASOF (${SHA:0:16})"

      - name: Verify the canonical endpoint
        run: |
          set -euo pipefail
          sleep 15
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' \
            -o live.json https://stacktrace-studios.com/data/fracturedus/snapshot.json
          LOCAL=$(shasum -a 256 snapshot.json | cut -d' ' -f1)
          LIVE=$(shasum -a 256 live.json | cut -d' ' -f1)
          if [ "$LOCAL" != "$LIVE" ]; then
            echo "::error::endpoint is not serving what was just uploaded"
            echo "  uploaded $LOCAL"
            echo "  serving  $LIVE"
            exit 1
          fi
          python3 - <<'CHECK'
          import json, datetime, sys
          d = json.load(open('live.json'))
          age = (datetime.date.today() - datetime.date.fromisoformat(d['asOf'])).days
          print(f"endpoint asOf {d['asOf']} ({age}d), composite {d['composite']['score']}")
          if age > 10:
              print(f"::error::feed is {age} days old; the serving layer has stopped tracking the generator")
              sys.exit(1)
          CHECK
          rm -f live.json
